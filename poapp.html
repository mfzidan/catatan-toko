<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar PO — TokoKusenPintu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d141d;--card:#16212f;--card2:#1c2a3b;--line:#24364c;--txt:#eaf2f8;--mut:#8aa2b8;
--gold:#ffd54a;--grn:#4ade80;--org:#fb923c;--blu:#60a5fa;--red:#f87171;--pur:#c084fc}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding-bottom:100px}
header{position:sticky;top:0;z-index:20;background:rgba(13,20,29,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16.5px;font-weight:800}
header h1 span{color:var(--gold)}
.hdr-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.total{font-size:11px;color:var(--mut);text-align:right}
.total b{display:block;font-size:15px;color:var(--gold)}
.btn-xls{border:1px solid var(--grn);background:rgba(74,222,128,.08);color:var(--grn);font-family:inherit;
  font-size:11.5px;font-weight:800;padding:9px 14px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-xls:active{transform:scale(.95)}
.filter{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.chip{padding:7px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.list{padding:4px 16px;display:grid;gap:10px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
@media(min-width:1050px){.list{grid-template-columns:repeat(3,1fr)}main{max-width:1200px;margin:0 auto}}
main{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.985)}
.row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.nama{font-weight:800;font-size:15px}
.nama .sapa{color:var(--blu);font-weight:700;font-size:12.5px;margin-right:4px}
.badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.5px;flex-shrink:0}
.b-proses{background:#3b2f14;color:var(--org)}
.b-ready{background:#0f2e1d;color:var(--grn)}
.b-kirim{background:#14263b;color:var(--blu)}
.b-lunas{background:#2a1740;color:var(--pur)}
.meta{font-size:12.5px;color:var(--mut);line-height:1.8}
.meta b{color:var(--txt);font-weight:600}
.meta a{color:var(--grn);text-decoration:none;font-weight:700}
.harga{font-size:16.5px;font-weight:800;color:var(--gold);margin-top:6px}
.harga small{font-size:11.5px;color:var(--grn);font-weight:600}
.fab{position:fixed;bottom:20px;right:18px;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#ffd54a,#f59e0b);font-size:26px;font-weight:800;color:#1a1a1a;
  box-shadow:0 8px 24px rgba(245,158,11,.4);z-index:30}
.fab:active{transform:scale(.93)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:40;display:none;
  align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 30px;
  max-height:90vh;overflow-y:auto;animation:up .25s ease}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:17px;font-weight:800;margin-bottom:14px}
.sheet h3{font-size:12px;font-weight:800;color:var(--blu);letter-spacing:1px;margin:16px 0 4px;text-transform:uppercase;
  border-top:1px dashed var(--line);padding-top:14px}
.lbl{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.6px;margin:10px 0 5px;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:130px 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.btn-save{background:linear-gradient(135deg,#ffd54a,#f59e0b);color:#1a1a1a}
.btn-del{background:#3a1520;color:var(--red);flex:0 0 100px}
.tabs2{display:flex;gap:8px;padding:12px 16px 0}
.tabs2 button{flex:1;padding:11px;border:none;border-radius:13px;background:var(--card);border:1px solid var(--line);
  font-family:inherit;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer;transition:all .2s}
.tabs2 button.on{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;border-color:#3b82f6}
.stokwrap{display:none;padding:12px 16px}
.stokwrap.show{display:block}
main.tabmain{display:none}
main.tabmain.show{display:block}
@media(min-width:1050px){.stokwrap{max-width:1200px;margin:0 auto}}
.sgrid{display:grid;gap:10px}
@media(min-width:700px){.sgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1050px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.scard .srow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.scard .sem{font-size:26px}
.scard .snm{font-weight:800;font-size:14.5px;flex:1}
.scard .stc{font-size:22px;font-weight:800;padding:4px 14px;border-radius:12px;min-width:44px;text-align:center}
.stc.hijau{background:rgba(74,222,128,.12);color:var(--grn)}
.stc.kuning{background:rgba(251,146,60,.12);color:var(--org)}
.stc.merah{background:rgba(248,113,113,.12);color:var(--red)}
.uklist{display:flex;flex-direction:column;gap:6px}
.ukrow{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:7px 10px}
.ukrow .uk{font-size:12px;font-weight:700;color:var(--mut);flex:1}
.ukrow .ukc{font-size:15px;font-weight:800;min-width:30px;text-align:center}
.ukrow .ukc.hijau{color:var(--grn)}.ukrow .ukc.kuning{color:var(--org)}.ukrow .ukc.merah{color:var(--red)}
.ukrow .ukops{display:flex;gap:4px}
.ukrow .ukops button{width:30px;height:28px;border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.06);color:var(--txt)}
.ukrow .ukops .min{color:var(--red)}.ukrow .ukops .plus{color:var(--grn)}
.ukrow .ukops .ed{color:var(--blu)}
.scards{display:grid;gap:10px}
@media(min-width:700px){.scards{grid-template-columns:1fr 1fr}}
@media(min-width:1050px){.scards{grid-template-columns:repeat(2,1fr)}}
.scards .scard .sops button.ed{background:rgba(96,165,250,.1);color:var(--blu)}
.scards .scard .sops button.plus{background:rgba(74,222,128,.1);color:var(--grn)}
.scards .scard .sops{gap:8px}
.scards .scard .sops button{flex:1;padding:9px;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;background:var(--card2);color:var(--txt)}
.scards .scard .sops .min{color:var(--red)}.scards .scard .sops .ed{flex:0 0 auto;padding:9px 12px}
.scard .sops{display:flex;gap:8px}
.scard .sops button{flex:1;padding:9px;border:none;border-radius:10px;font-family:inherit;font-weight:800;
  font-size:12px;cursor:pointer;background:var(--card2);color:var(--txt)}
.scard .sops .min{color:var(--red)}.scard .sops .plus{color:var(--grn)}
.scard .sops .ed{flex:0 0 42px}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:14px;line-height:1.8;grid-column:1/-1}
.empty span{font-size:40px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>📋 Daftar <span>PO</span></h1>
  <div class="hdr-right">
    <span id="syncInfo" style="font-size:10px;color:var(--mut)">☁️ …</span>
    <button class="btn-xls" onclick="cloudLoad(true)" style="border-color:var(--blu);color:var(--blu)">🔄 Tarik</button>
    <button class="btn-xls" onclick="exportXls()">⬇ Excel</button>
    <div class="total">Total semua<br><b id="tot">Rp 0</b></div>
  </div>
</header>
<div class="tabs2">
  <button class="on" id="tabPO" onclick="tabTo('po')">📋 Daftar PO</button>
  <button id="tabStok" onclick="tabTo('stok')">📦 Stok Barang Ready</button>
</div>
<div class="filter" id="filter"></div>
<main class="tabmain show" id="mainPO"><div class="list" id="list"></div></main>
<div class="stokwrap" id="mainStok">
  <div class="scards" id="stokGrid"></div>
</div>
<button class="fab" onclick="bukaForm()">+</button>

<div class="ov" id="ov">
  <div class="sheet">
    <h2 id="judul">Tambah PO</h2>

    <h3>👤 Data Customer</h3>
    <div class="row2">
      <div><div class="lbl">No. Customer</div><input id="fNo" placeholder="cth: C-001"></div>
      <div><div class="lbl">Sapaan</div>
        <select id="fSapa"><option value="Ibu">👩 Ibu</option><option value="Bapak">👨 Bapak</option></select></div>
    </div>
    <div class="lbl">Nama</div><input id="fNama" placeholder="cth: Adi Limas">
    <div class="lbl">WhatsApp</div><input id="fWa" type="tel" inputmode="numeric" placeholder="cth: 087718747057">
    <div class="lbl">Alamat tinggal</div><textarea id="fAlamat" rows="2" placeholder="cth: Cimuning, Mustikajaya — Bekasi"></textarea>

    <h3>📦 Pesanan</h3>
    <div class="lbl">Produk / detail</div><input id="fProduk" placeholder="cth: 8 set kusen pintu multiplek">
    <div class="row2">
      <div><div class="lbl">Tanggal order</div><input id="fTgl" type="date"></div>
      <div><div class="lbl">Target selesai</div><input id="fTarget" type="date"></div>
    </div>
    <div class="row2">
      <div><div class="lbl">Biaya (Rp)</div><input id="fBiaya" type="number" inputmode="numeric" placeholder="0"></div>
      <div><div class="lbl">DP diterima (Rp)</div><input id="fDp" type="number" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="lbl">Status</div>
    <select id="fStatus">
      <option value="proses">🔧 On Proses</option>
      <option value="ready">✅ Ready</option>
      <option value="kirim">🚚 Siap Kirim</option>
      <option value="lunas">💰 Lunas</option>
    </select>
    <div class="lbl">Catatan (opsional)</div>
    <textarea id="fNote" rows="2" placeholder="cth: harga per set 8.075.000"></textarea>

    <div class="btns">
      <button class="btn btn-del" id="btnDel" onclick="hapus()">🗑 Hapus</button>
      <button class="btn btn-save" onclick="simpan()">💾 Simpan</button>
    </div>
  </div>
</div>

<script>
const KEY='po_toko_v2';
const SKEY='stok_barang_v1';
const SB_URL='https://gmnqwnydukiebtxhxyyd.supabase.co';
const SB_KEY='sb_publishable_5SBOrAbFkJ01nf8FuEgpsQ_LaGFpVe9';
const SB_TBL='po_data';
let stok=null;
try{stok=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
if(!stok)stok=[
  {em:'🪟',nm:'Kusen',items:[{u:'70x180',c:0},{u:'80x190',c:0},{u:'90x200',c:0}]},
  {em:'🚪',nm:'Pintu',items:[{u:'70x180',c:0},{u:'80x190',c:0},{u:'90x200',c:0}]},
  {em:'🪟',nm:'Daun Jendela',items:[{u:'50x60',c:0},{u:'60x80',c:0}]},
  {em:'🏠',nm:'Loster',items:[{u:'6cm',c:0},{u:'9cm',c:0},{u:'12cm',c:0}]}
];
function tabTo(t){
  document.getElementById('tabPO').classList.toggle('on',t==='po');
  document.getElementById('tabStok').classList.toggle('on',t==='stok');
  document.getElementById('mainPO').classList.toggle('show',t==='po');
  document.getElementById('mainStok').classList.toggle('show',t==='stok');
  document.getElementById('filter').style.display=t==='po'?'flex':'none';
  document.querySelector('.fab').style.display=t==='po'?'block':'none';
  document.getElementById('tot').parentElement.style.display=t==='po'?'flex':'none';
  if(t==='stok')renderStokBarang();
}
function renderStokBarang(){
  const g=document.getElementById('stokGrid');
  g.innerHTML=stok.map((gr,gi)=>{
    const total=gr.items.reduce((s,it)=>s+it.c,0);
    const cls=total<=0?'merah':(total<=5?'kuning':'hijau');
    return `<div class="scard">
      <div class="srow"><span class="sem">${gr.em}</span><span class="snm">${esc(gr.nm)}</span><span class="stc ${cls}">${total}</span></div>
      <div class="uklist">
        ${gr.items.map((it,ii)=>{
          const c2=it.c<=0?'merah':(it.c<=5?'kuning':'hijau');
          return `<div class="ukrow"><span class="uk">${esc(it.u)}</span>
            <span class="ukc ${c2}">${it.c}</span>
            <span class="ukops">
              <button class="min" onclick="chgU(${gi},${ii},-1)">−</button>
              <button class="plus" onclick="chgU(${gi},${ii},1)">+</button>
              <button class="ed" onclick="editUk(${gi},${ii})">✏️</button>
            </span></div>`;}).join('')}
      </div>
      <div class="sops" style="margin-top:10px">
        <button class="ed" onclick="editGrp(${gi})">✏️ Edit Jenis</button>
        <button class="plus" onclick="addUk(${gi})">+ Ukuran</button>
      </div>
    </div>`;}).join('');
}
function chgU(gi,ii,d){
  stok[gi].items[ii].c=Math.max(0,stok[gi].items[ii].c+d);
  saveStok();renderStokBarang();
}
function editUk(gi,ii){
  const it=stok[gi].items[ii];
  const u=prompt('Ukuran:',it.u);if(u===null)return;
  const c=prompt('Jumlah stok:',it.c);if(c===null)return;
  stok[gi].items[ii]={u:u.trim()||it.u,c:Math.max(0,parseInt(c)||0)};
  saveStok();renderStokBarang();
}
function addUk(gi){
  const u=prompt('Ukuran baru (cth: 100x210):');if(!u)return;
  const c=prompt('Jumlah stok:',0);if(c===null)return;
  stok[gi].items.push({u:u.trim(),c:Math.max(0,parseInt(c)||0)});
  saveStok();renderStokBarang();
}
function editGrp(gi){
  const g=stok[gi];
  const nm=prompt('Nama jenis barang:',g.nm);if(nm===null)return;
  const em=prompt('Emoji:',g.em);if(em===null)return;
  stok[gi]={em:em.trim()||'📦',nm:nm.trim()||g.nm,items:g.items};
  saveStok();renderStokBarang();
}
function chg(i,d){
  stok[i].c=Math.max(0,stok[i].c+d);
  saveStok();renderStokBarang();
}
function editStok(i){
  const s=stok[i];
  const nm=prompt('Nama barang:',s.nm);if(nm===null)return;
  const em=prompt('Emoji:',s.em);if(em===null)return;
  const c=prompt('Jumlah stok:',s.c);if(c===null)return;
  stok[i]={em:em.trim()||'📦',nm:nm.trim()||s.nm,c:Math.max(0,parseInt(c)||0)};
  saveStok();renderStokBarang();
}
function chg(i,d){
  stok[i].c=Math.max(0,stok[i].c+d);
  saveStok();renderStokBarang();
}
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
/* migrasi data versi lama */
data=data.map(d=>({...d,no:d.no||'',sapa:d.sapa||'',wa:d.wa||''}));
let editId=null, filter='semua';
const label={proses:'ON PROSES',ready:'READY',kirim:'SIAP KIRIM',lunas:'LUNAS'};
const rp=n=>'Rp '+(+n||0).toLocaleString('id');

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  cloudSave();
}
function saveStok(){
  localStorage.setItem(SKEY,JSON.stringify(stok));
  cloudSave();
}
let cloudBusy=false, cloudDirty=false, lastSync='';
function setSync(t){
  lastSync=t;
  const el=document.getElementById('syncInfo');
  if(el)el.textContent=t;
}
async function cloudSave(){
  if(cloudBusy){cloudDirty=true;return;}
  cloudBusy=true;
  setSync('☁️ menyimpan…');
  try{
    const payload={id:1,doc:{po:data,stok,updatedAt:Date.now()}};
    const r=await fetch(SB_URL+'/rest/v1/'+SB_TBL+'?on_conflict=id',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(await r.text());
    setSync('☁️ tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('⚠️ simpan gagal — coba tombol Tarik');}
  cloudBusy=false;
  if(cloudDirty){cloudDirty=false;cloudSave();}
}
async function cloudLoad(force){
  setSync('☁️ mengambil…');
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+SB_TBL+'?id=eq.1&select=doc&t='+Date.now(),
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok)throw new Error(await r.text());
    const arr=await r.json();
    if(!arr.length){setSync('☁️ cloud kosong');return;}
    const d=arr[0].doc||{};
    if(d.po)data=d.po;
    if(d.stok)stok=d.stok;
    localStorage.setItem(KEY,JSON.stringify(data));
    localStorage.setItem(SKEY,JSON.stringify(stok));
    render();renderStokBarang();
    setSync('☁️ sinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' — '+data.length+' PO');
  }catch(e){setSync('⚠️ ambil gagal — periksa internet');}
}

function waLink(wa){
  if(!wa)return'';
  let w=wa.replace(/\D/g,'');
  if(w.startsWith('0'))w='62'+w.slice(1);
  return 'https://wa.me/'+w;
}
function setF(s){filter=s;render();}

function render(){
  const f=document.getElementById('filter');
  f.innerHTML=['semua','proses','ready','kirim','lunas'].map(s=>
    '<div class="chip'+(filter===s?' on':'')+'" onclick="setF(\''+s+'\')">'+(s==='semua'?'Semua':label[s])+'</div>').join('');
  const el=document.getElementById('list');
  const items=data.filter(d=>filter==='semua'||d.status===filter)
    .sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));
  if(!items.length){el.innerHTML='<div class="empty"><span>📭</span>Belum ada PO.<br>Tekan tombol <b>+</b> untuk tambah pesanan.</div>';}
  else el.innerHTML=items.map(d=>{
    const sisa=(+d.biaya||0)-(+d.dp||0);
    const nama=(d.sapa?'<span class="sapa">'+esc(d.sapa)+'</span>':'')+esc(d.nama)+(d.no?' <small style="color:var(--mut);font-weight:600">#'+esc(d.no)+'</small>':'');
    return `<div class="card" onclick="bukaForm('${d.id}')">
      <div class="row1"><div class="nama">${nama}</div><span class="badge b-${d.status}">${label[d.status]}</span></div>
      <div class="meta">${d.wa?`📱 <a href="${waLink(d.wa)}" target="_blank" onclick="event.stopPropagation()">${esc(d.wa)}</a><br>`:''}📍 ${esc(d.alamat)||'-'}<br>🧾 ${esc(d.produk)||'-'}<br>📅 ${d.tgl||'-'}${d.target?' → '+d.target:''}</div>
      <div class="harga">${rp(d.biaya)}${+d.dp>0?` <small>· DP ${rp(d.dp)} · sisa ${rp(sisa)}</small>`:''}</div>
      ${d.note?`<div class="meta" style="margin-top:5px;font-style:italic">📝 ${esc(d.note)}</div>`:''}
    </div>`;}).join('');
  const tot=data.reduce((s,d)=>s+(+d.biaya||0),0);
  document.getElementById('tot').textContent=rp(tot);
}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

function bukaForm(id){
  editId=id||null;
  document.getElementById('judul').textContent=id?'Edit PO':'Tambah PO';
  document.getElementById('btnDel').style.display=id?'block':'none';
  const d=id?data.find(x=>x.id===id):null;
  fNo.value=d?.no||autoNo();fSapa.value=d?.sapa||'Ibu';fNama.value=d?.nama||'';fWa.value=d?.wa||'';
  fAlamat.value=d?.alamat||'';fProduk.value=d?.produk||'';
  fTgl.value=d?.tgl||new Date().toISOString().slice(0,10);
  fTarget.value=d?.target||'';fBiaya.value=d?.biaya||'';fDp.value=d?.dp||'';
  fStatus.value=d?.status||'proses';fNote.value=d?.note||'';
  document.getElementById('ov').classList.add('show');
}
function autoNo(){
  const nums=data.map(d=>parseInt((d.no||'').replace(/\D/g,''))).filter(n=>!isNaN(n));
  return 'C-'+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
}
function tutup(){document.getElementById('ov').classList.remove('show');}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')tutup()});

function simpan(){
  if(!fNama.value.trim()){fNama.focus();return;}
  const d={id:editId||Date.now().toString(36),no:fNo.value.trim(),sapa:fSapa.value,nama:fNama.value.trim(),
    wa:fWa.value.trim(),alamat:fAlamat.value.trim(),produk:fProduk.value.trim(),
    tgl:fTgl.value,target:fTarget.value,biaya:+fBiaya.value||0,dp:+fDp.value||0,
    status:fStatus.value,note:fNote.value.trim()};
  if(editId){data=data.map(x=>x.id===editId?d:x);}else{data.push(d);}
  save();tutup();render();
}
function hapus(){
  if(editId&&confirm('Hapus PO ini?')){data=data.filter(x=>x.id!==editId);save();tutup();render();}
}

/* export excel: file .xls (HTML table) — terbuka langsung di Excel/WPS/Sheets */
function exportXls(){
  if(!data.length){alert('Belum ada data untuk diunduh.');return;}
  const sorted=[...data].sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));
  let rows='<tr><th>No Customer</th><th>Sapaan</th><th>Nama</th><th>WhatsApp</th><th>Alamat</th><th>Produk</th><th>Tgl Order</th><th>Target Selesai</th><th>Biaya</th><th>DP</th><th>Sisa</th><th>Status</th><th>Catatan</th></tr>';
  sorted.forEach(d=>{
    rows+=`<tr><td>${d.no||''}</td><td>${d.sapa||''}</td><td>${d.nama||''}</td><td>${d.wa||''}</td><td>${d.alamat||''}</td><td>${d.produk||''}</td><td>${d.tgl||''}</td><td>${d.target||''}</td><td>${+d.biaya||0}</td><td>${+d.dp||0}</td><td>${(+d.biaya||0)-(+d.dp||0)}</td><td>${label[d.status]||''}</td><td>${d.note||''}</td></tr>`;
  });
  const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>
  <table border="1">${rows}</table></body></html>`;
  const blob=new Blob([html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Database_PO_TokoKusenPintu_'+new Date().toISOString().slice(0,10)+'.xls';
  a.click();URL.revokeObjectURL(a.href);
}
render();cloudLoad(true);
</script>
