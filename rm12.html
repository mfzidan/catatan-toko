<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ My Corner ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffb7d5;--pink2:#ffe3ef;--lav:#d9c9ff;--cream:#fff7fa;--ink:#7a4a63;--mut:#b58ba3;
--card:#fff;--sh:0 10px 30px rgba(255,150,200,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#ffeaf4,#f4ecff 50%,#e8fbf4);min-height:100vh;
  font-family:'Quicksand',sans-serif;color:var(--ink);padding-bottom:110px}
.deco{position:fixed;font-size:22px;opacity:.5;animation:fl 5s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.hero{text-align:center;padding:30px 20px 8px;position:relative}
.avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-size:40px;background:linear-gradient(135deg,#ffb7d5,#d9c9ff);box-shadow:0 8px 24px rgba(255,140,200,.35);
  animation:bob 3.5s ease-in-out infinite;cursor:pointer;border:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-family:'Baloo 2';font-size:28px;font-weight:800;cursor:pointer;
  background:linear-gradient(90deg,#ff8fc0,#b58cff,#5fc9a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:12px;color:var(--mut);font-weight:600}
.edithint{font-size:10.5px;color:#d9a8c4;margin-top:6px}
nav{display:flex;justify-content:center;gap:8px;padding:14px;position:sticky;top:0;z-index:20;
  background:rgba(255,247,250,.85);backdrop-filter:blur(10px);flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:999px;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink);
  text-decoration:none;box-shadow:0 3px 10px rgba(255,150,200,.15)}
nav a:active{background:var(--pink2)}
main{max-width:680px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
section{background:var(--card);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:var(--sh);border:1px solid #ffeef5}
h2{font-family:'Baloo 2';font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
h2 .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.addbtn{margin-left:auto;border:none;background:linear-gradient(135deg,#ffb7d5,#d9c9ff);color:#fff;
  font-family:inherit;font-weight:800;font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer}
.day-tab{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.day-tab::-webkit-scrollbar{display:none}
.day-tab button{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:none;background:var(--cream);
  font-family:inherit;font-weight:700;font-size:12px;color:var(--mut);cursor:pointer}
.day-tab button.on{background:linear-gradient(135deg,#ffb7d5,#d9c9ff);color:#fff}
.jad{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.j{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:14px;padding:10px 13px}
.j .jam{font-family:'Baloo 2';font-weight:800;font-size:12.5px;color:#b58cff;min-width:64px}
.j .mapel{font-weight:700;font-size:13.5px;flex:1}
.j .buk{font-size:10.5px;color:var(--mut);max-width:32%;text-align:right}
.j .ops{display:flex;gap:4px}
.j .ops button{border:none;background:none;cursor:pointer;font-size:14px;padding:2px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:none;border-radius:12px;background:var(--cream);font-family:inherit;font-weight:700;font-size:12.5px;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,#ffc9a8,#ffb7d5);color:#fff}
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:14px;padding:10px 13px}
.sitem .em{font-size:21px}
.sitem .nm{font-weight:700;font-size:13px;flex:1}
.sitem .st{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;cursor:pointer}
.st-ok{background:#d8f7e8;color:#1d9e6b}.st-low{background:#ffefd8;color:#e8890c}.st-out{background:#ffe0e6;color:#e0475f}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.kal .h{text-align:center;font-size:10.5px;font-weight:800;color:var(--mut);padding:4px 0}
.kal .d{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:var(--cream);position:relative;cursor:pointer}
.kal .d.merah{background:#ffe0e6;color:#e0475f}
.kal .d.today{outline:2.5px solid #b58cff;outline-offset:-2px;background:#f0e8ff;color:#8a5ccf}
.kal .d.note::after{content:'📌';position:absolute;top:-6px;right:-4px;font-size:10px}
.note-list{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.note-list .n{background:var(--cream);border-radius:12px;padding:9px 13px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.note-list .dt{font-weight:800;color:#e0475f;min-width:58px}
.note-list .x{margin-left:auto;border:none;background:none;color:#e0475f;font-weight:800;cursor:pointer;font-size:14px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(80,40,70,.45);backdrop-filter:blur(4px);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:22px 20px 30px;max-height:88vh;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-family:'Baloo 2';font-size:16px;margin-bottom:12px;color:#b5638f}
.lbl{font-size:11px;font-weight:800;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid #f3d7e5;background:var(--cream);
  color:var(--ink);font-size:14px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--pink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.btn-save{background:linear-gradient(135deg,#ffb7d5,#b58cff);color:#fff}
.btn-del{background:#ffe0e6;color:#e0475f;flex:0 0 90px}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:18px}
footer{text-align:center;font-size:11px;color:var(--mut);font-weight:600;padding:8px}
</style>
</head>
<body>
<div class="deco" style="top:6%;left:6%">🌸</div>
<div class="deco" style="top:12%;right:8%;animation-delay:1s">🎀</div>
<div class="deco" style="top:50%;left:4%;animation-delay:2s">💕</div>
<div class="deco" style="top:70%;right:5%;animation-delay:.5s">✨</div>

<div class="hero">
  <button class="avatar" onclick="editNama()" title="klik untuk ganti nama & avatar">🎀</button>
  <h1 onclick="editNama()">✨ <span id="ownerName">Ana</span>'s Corner ✨</h1>
  <p>JADWAL · STOK · KALENDER</p>
  <div class="edithint">💡 tekan nama/avatar untuk ganti · semua data tersimpan otomatis</div>
</div>
<nav>
  <a href="#jadwal">📚 Jadwal</a>
  <a href="#stok">💄 Stok</a>
  <a href="#kalender">📅 Kalender</a>
</nav>
<main>
  <section id="jadwal">
    <h2><span class="ic" style="background:#ffe0ee">📚</span> Jadwal Pelajaran
      <button class="addbtn" onclick="formJad()">+ Tambah</button></h2>
    <div class="day-tab" id="days"></div>
    <div class="jad" id="jad"></div>
  </section>

  <section id="stok">
    <h2><span class="ic" style="background:#fff0dd">💄</span> Stok
      <button class="addbtn" onclick="formStok()">+ Tambah</button></h2>
    <div class="tabs">
      <button class="on" onclick="stokTab('sk')">🧴 Skincare</button>
      <button onclick="stokTab('pf')">🌸 Parfum</button>
    </div>
    <div class="slist" id="stoklist"></div>
  </section>

  <section id="kalender">
    <h2><span class="ic" style="background:#ffe6f0">📅</span> <span id="bln">Kalender</span>
      <button class="addbtn" onclick="formNote()">+ Note</button></h2>
    <div class="kal" id="kal"></div>
    <div class="note-list" id="notes"></div>
  </section>
</main>
<footer>Dibuat dengan 💖</footer>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='ana_corner_v1';
const DEF={
  nama:'Ana', avatar:'🎀',
  jadwal:{},
  stok:{sk:[["🧴","Sunscreen","ok"]],pf:[["🌸","Body mist","ok"]]},
  notes:[]
};
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){DB=null;}
if(!DB)DB=JSON.parse(JSON.stringify(DEF));
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* nama & avatar */
function applyOwner(){
  $('ownerName').textContent=DB.nama;
  document.querySelector('.avatar').textContent=DB.avatar;
  document.title='✨ '+DB.nama+"'s Corner ✨";
}
function editNama(){
  openSheet(`<h3>✏️ Ganti Nama & Avatar</h3>
    <div class="lbl">Nama</div><input id="eNama" value="${esc(DB.nama)}" maxlength="20">
    <div class="lbl">Avatar (emoji)</div><input id="eAv" value="${DB.avatar}" maxlength="4">
    <div class="btns"><button class="btn btn-save" onclick="saveNama()">💾 Simpan</button></div>`);
}
function saveNama(){
  DB.nama=$('eNama').value.trim()||'Ana';DB.avatar=$('eAv').value.trim()||'🎀';
  save();applyOwner();closeSheet();
}

/* jadwal */
const hari=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const now=new Date();const hariIni=hari[Math.min(Math.max(now.getDay()-1,0),5)];
let selHari=hariIni;
function renderJad(){
  $('days').innerHTML=hari.map(h=>`<button class="${h===selHari?'on':''}" onclick="selHari='${h}';renderJad()">${h}${h===hariIni?' 📍':''}</button>`).join('');
  const list=DB.jadwal[selHari]||[];
  $('jad').innerHTML=list.length?list.map((r,i)=>
    `<div class="j"><span class="jam">${esc(r[0])}</span><span class="mapel">${esc(r[1])}</span><span class="buk">${esc(r[2]||'')}</span>
     <span class="ops"><button onclick="formJad(${i})">✏️</button><button onclick="delJad(${i})">🗑</button></span></div>`).join('')
    :'<div class="empty">Belum ada jadwal hari ini. Tekan + Tambah ✨</div>';
}
function formJad(i){
  const r=i!=null?(DB.jadwal[selHari][i]):['','',''];
  openSheet(`<h3>📚 ${i!=null?'Edit':'Tambah'} Jadwal — ${selHari}</h3>
    <div class="row2">
      <div><div class="lbl">Jam</div><input id="eJam" value="${esc(r[0])}" placeholder="07.15"></div>
      <div><div class="lbl">Hari</div><select id="eHari">${hari.map(h=>`<option ${h===selHari?'selected':''}>${h}</option>`).join('')}</select></div>
    </div>
    <div class="lbl">Mata pelajaran</div><input id="eMapel" value="${esc(r[1])}" placeholder="Matematika">
    <div class="lbl">Buku / perlengkapan</div><input id="eBuk" value="${esc(r[2]||'')}" placeholder="buku + calculator">
    <div class="btns">
      ${i!=null?'<button class="btn btn-del" onclick="delJad('+i+',true)">🗑</button>':''}
      <button class="btn btn-save" onclick="saveJad(${i})">💾 Simpan</button>
    </div>`);
}
function saveJad(i){
  const h=$('eHari').value;
  const r=[$('eJam').value.trim(),$('eMapel').value.trim(),$('eBuk').value.trim()];
  if(!r[1]){closeSheet();return;}
  if(!DB.jadwal[h])DB.jadwal[h]=[];
  if(i!=null){const old=DB.jadwal[selHari][i];
    if(h===selHari)DB.jadwal[h][i]=r;else{DB.jadwal[selHari].splice(i,1);DB.jadwal[h].push(r);}}
  else DB.jadwal[h].push(r);
  selHari=h;save();closeSheet();renderJad();
}
function delJad(i,viaSheet){
  if(!confirm('Hapus jadwal ini?'))return;
  DB.jadwal[selHari].splice(i,1);save();closeSheet();renderJad();
}

/* stok */
let sTab='sk';
function stokTab(t){sTab=t;renderStok();
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(t==='sk')));}
const stLbl={ok:['st-ok','AMAN ✓'],low:['st-low','HAMPIR HABIS'],out:['st-out','HABIS ✗']};
function renderStok(){
  const list=DB.stok[sTab]||[];
  $('stoklist').innerHTML=list.length?list.map((r,i)=>
    `<div class="sitem"><span class="em">${r[0]}</span><span class="nm">${esc(r[1])}</span>
     <span class="st ${stLbl[r[2]][0]}" onclick="cycleStok(${i})">${stLbl[r[2]][1]}</span>
     <span class="ops"><button style="border:none;background:none;cursor:pointer" onclick="formStok(${i})">✏️</button>
     <button style="border:none;background:none;cursor:pointer" onclick="delStok(${i})">🗑</button></span></div>`).join('')
    :'<div class="empty">Kosong. Tekan + Tambah 💄</div>';
}
function formStok(i){
  const r=i!=null?DB.stok[sTab][i]:['','Nama produk','ok'];
  openSheet(`<h3>💄 ${i!=null?'Edit':'Tambah'} Stok</h3>
    <div class="row2">
      <div><div class="lbl">Emoji</div><input id="sEm" value="${r[0]}" maxlength="4"></div>
      <div><div class="lbl">Kategori</div><select id="sKat"><option value="sk" ${sTab==='sk'?'selected':''}>🧴 Skincare</option><option value="pf" ${sTab==='pf'?'selected':''}>🌸 Parfum</option></select></div>
    </div>
    <div class="lbl">Nama produk</div><input id="sNm" value="${esc(r[1])}">
    <div class="lbl">Status (klik badge juga bisa ganti)</div>
    <select id="sSt"><option value="ok" ${r[2]==='ok'?'selected':''}>AMAN</option><option value="low" ${r[2]==='low'?'selected':''}>HAMPIR HABIS</option><option value="out" ${r[2]==='out'?'selected':''}>HABIS</option></select>
    <div class="btns">
      ${i!=null?'<button class="btn btn-del" onclick="delStok('+i+',true)">🗑</button>':''}
      <button class="btn btn-save" onclick="saveStok(${i})">💾 Simpan</button>
    </div>`);
}
function saveStok(i){
  const kat=$('sKat').value;
  const r=[$('sEm').value.trim()||'🌸',$('sNm').value.trim(),$('sSt').value];
  if(i!=null){const old=DB.stok[sTab][i];
    if(kat===sTab)DB.stok[sTab][i]=r;else{DB.stok[sTab].splice(i,1);DB.stok[kat].push(r);}}
  else DB.stok[kat].push(r);
  sTab=kat;save();closeSheet();renderStok();
  document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',(j===0)===(sTab==='sk')));
}
function cycleStok(i){
  const order=['ok','low','out'];
  DB.stok[sTab][i][2]=order[(order.indexOf(DB.stok[sTab][i][2])+1)%3];
  save();renderStok();
}
function delStok(i,viaSheet){
  if(!confirm('Hapus item ini?'))return;
  DB.stok[sTab].splice(i,1);save();closeSheet();renderStok();
}

/* kalender & note */
function renderKal(){
  const y=now.getFullYear(),m=now.getMonth();
  $('bln').textContent='Kalender — '+now.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const todayStr=now.toISOString().slice(0,10);
  let html='<div class="h">Min</div><div class="h">Sen</div><div class="h">Sel</div><div class="h">Rab</div><div class="h">Kam</div><div class="h">Jum</div><div class="h">Sab</div>';
  for(let i=0;i<first;i++)html+='<div class="d"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['d'];if(DB.notes.some(n=>n.tgl===ds))cls.push('merah','note');
    if(ds===todayStr)cls.push('today');
    html+=`<div class="${cls.join(' ')}" onclick="formNote('${ds}')">${d}</div>`;
  }
  $('kal').innerHTML=html;
  const sorted=[...DB.notes].sort((a,b)=>a.tgl.localeCompare(b.tgl));
  $('notes').innerHTML=sorted.length?sorted.map(n=>{
    const [yy,mm,dd]=n.tgl.split('-');
    return `<div class="n"><span class="dt">${dd}/${mm}</span><span>${esc(n.txt)}</span>
      <span class="x" onclick="delNote('${n.id}')">✕</span></div>`;}).join('')
    :'<div class="empty">Belum ada note. Tekan tanggal di kalender atau + Note 📌</div>';
}
function formNote(tgl){
  const ds=tgl||new Date().toISOString().slice(0,10);
  openSheet(`<h3>📌 Tanggal Merah / Note</h3>
    <div class="lbl">Tanggal</div><input id="nTgl" type="date" value="${ds}">
    <div class="lbl">Keterangan</div><textarea id="nTxt" rows="2" placeholder="cth: Ujian Kimia 🧪"></textarea>
    <div class="btns"><button class="btn btn-save" onclick="saveNote()">💾 Simpan</button></div>`);
}
function saveNote(){
  const t=$('nTxt').value.trim();if(!t){closeSheet();return;}
  DB.notes.push({id:Date.now().toString(36),tgl:$('nTgl').value,txt:t});
  save();closeSheet();renderKal();
}
function delNote(id){
  DB.notes=DB.notes.filter(n=>n.id!==id);save();renderKal();
}

/* modal */
function openSheet(html){$('sheet').innerHTML=html;$('ov').classList.add('show');}
function closeSheet(){$('ov').classList.remove('show');}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet();});

applyOwner();renderJad();renderStok();renderKal();
</script>
</body>
</html>
