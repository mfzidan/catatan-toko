<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffeaf4,#f4ecff);font-family:'Baloo 2',sans-serif;color:#7a4a63;padding:24px}
.card{text-align:center;max-width:380px;width:100%;padding:44px 30px;border-radius:26px;background:#fff;
  box-shadow:0 14px 40px rgba(255,150,200,.3)}
.lock{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:34px;background:linear-gradient(135deg,#ffb7d5,#d9c9ff)}
h1{font-size:21px;margin-bottom:6px}
p{font-size:13px;color:#b58ba3;font-weight:600;margin-bottom:22px;line-height:1.6}
input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #f3d7e5;background:#fff7fa;
  font-size:15px;font-family:inherit;text-align:center;outline:none;margin-bottom:12px}
input:focus{border-color:#ffb7d5}
button{width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-family:inherit;font-weight:700;
  color:#fff;background:linear-gradient(135deg,#ffb7d5,#b58cff)}
.err{color:#e0475f;font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600}
.deco{font-size:20px;letter-spacing:8px;margin-bottom:14px;opacity:.8}
</style>
</head>
<body>
<div class="card">
  <div class="deco">🌸 🎀 💕</div>
  <div class="lock">🔒</div>
  <h1>Halaman Spesial</h1>
  <p>Halaman ini hanya untuk seseorang yang istimewa.<br>Masukkan kata sandi untuk membuka ✨</p>
  <input type="password" id="pw" placeholder="Kata sandi" autocomplete="off">
  <button onclick="buka()">Buka 🌸</button>
  <div class="err" id="err"></div>
</div>
<script>
async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function buka(){
  if(await sha256(document.getElementById('pw').value)==='0c01cfbcaf171abe5b03ae8566de259776bb90b331c2e92ccff10e842bff7929'){
    sessionStorage.setItem('ok12','1');location.href='rm12.html';
  }else{document.getElementById('err').textContent='Kata sandi salah coba lagi 🙈';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')buka()});
if(sessionStorage.getItem('ok12')==='1')location.replace('rm12.html');
</script>
</body>
</html>
